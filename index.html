<style>
/* Layout: one-column mobile "instrument panel": a stopwatch-led drill card, everything reachable one-handed */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #15203a; --muted: #5d6680; --line: #d9dee8;
  --accent: #d08a00; --accent-ink: #1a1300; --good: #2c7a55; --bad: #c0392b; --soft: #e8ecf3;
  --good-soft: rgba(44,122,85,.14); --bad-soft: rgba(192,57,43,.13);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1424; --surface: #161e33; --ink: #e8ecf5; --muted: #98a2bc; --line: #2a3450;
    --accent: #f2b233; --good: #5fc391; --bad: #ef6b5b; --soft: #1e2840;
    --good-soft: rgba(95,195,145,.16); --bad-soft: rgba(239,107,91,.16);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .01em; text-align: left; color: var(--ink); }
.brand small { display: block; font-family: var(--f-body); font-weight: 400; font-size: .8rem; color: var(--muted); letter-spacing: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 .8rem var(--f-mono); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.05rem; }
.eyebrow { font: 600 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hero { border: 2px solid var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 4px; font: inherit; min-width: 0; }
.tile b { font-family: var(--f-display); font-size: 1rem; }
.tile span { color: var(--muted); font-size: .82rem; line-height: 1.35; }
button.btn { font: 600 1rem var(--f-body); border-radius: 12px; padding: 12px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.btn.amber { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.btn.block { width: 100%; }
button.btn:disabled { opacity: .5; cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--muted); font: 500 .9rem var(--f-body); text-decoration: underline; cursor: pointer; padding: 4px 0; }
.plain { background: none; border: 0; padding: 0; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 .75rem var(--f-mono); padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); }
.chip.lv { background: var(--ink); color: var(--bg); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.good { background: var(--good-soft); color: var(--good); }
.defects { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.defects li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.defects li:last-child { border-bottom: 0; padding-bottom: 0; }
.defects .n { font: 600 .8rem var(--f-mono); color: var(--muted); white-space: nowrap; }
.facts { margin: 0; padding-left: 18px; font-size: .92rem; display: flex; flex-direction: column; gap: 4px; }
.question { font-family: var(--f-display); font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
.speaker { font: 600 .75rem var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }

.clock.warn { color: var(--accent); }
.clock.cut { color: var(--bad); }
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
.meter { height: 34px; display: flex; align-items: center; justify-content: center; gap: 3px; }
.meter i { width: 6px; border-radius: 3px; background: var(--ink); height: 4px; transition: height .08s; }
.mic { width: 132px; height: 132px; border-radius: 50%; border: 0; align-self: center; background: var(--accent); color: var(--accent-ink); font: 700 1.05rem var(--f-display); cursor: pointer; box-shadow: 0 0 0 8px var(--soft); }
.mic.rec { background: var(--bad); color: #fff; }
textarea, input[type="text"], input[type="password"] { width: 100%; font: 1rem/1.5 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
textarea { min-height: 150px; resize: vertical; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.score { display: flex; align-items: baseline; gap: 8px; }
.score b { font: 600 2.6rem var(--f-mono); font-variant-numeric: tabular-nums; line-height: 1; }
.score span { color: var(--muted); font-family: var(--f-mono); }
.fix { border-left: 4px solid var(--accent); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 4px; }
.fix b { font-family: var(--f-display); font-size: 1.1rem; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metric { background: var(--soft); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.metric b { font: 600 1.1rem var(--f-mono); font-variant-numeric: tabular-nums; }
.metric span { font-size: .72rem; color: var(--muted); line-height: 1.25; }
.cmp { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.cmp .score { justify-content: center; }
.diff { line-height: 1.9; margin: 0; }
.diff .miss { background: var(--bad-soft); color: var(--bad); border-radius: 4px; padding: 0 3px; font-weight: 600; }
.hist { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.hist li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.hist li:last-child { border-bottom: 0; }
.hist .s { font: 600 .9rem var(--f-mono); font-variant-numeric: tabular-nums; }
.hist small { color: var(--muted); display: block; }
.notice { font-size: .85rem; padding: 10px 12px; border-radius: 10px; background: var(--soft); color: var(--muted); }
.notice.err { color: var(--bad); background: var(--bad-soft); }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .meter i { transition: none; } }
.transcript { white-space: pre-wrap; font-size: .95rem; margin: 0; }
.transcript mark { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 2px; }
.trap { display: flex; flex-wrap: wrap; gap: 6px; }
.pron { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.pron li { display: flex; flex-direction: column; gap: 2px; }
.pron b { font-family: var(--f-display); font-size: 1.05rem; }
details summary { cursor: pointer; font-weight: 600; }
.sticky-act { position: sticky; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); background: linear-gradient(to top, var(--bg) 70%, rgba(0,0,0,0)); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
label.field { display: flex; flex-direction: column; gap: 6px; }
</style>

    var clock = document.getElementById("clock"), bar = document.getElementById("bar");
    timer = setInterval(function () {
      var el = (Date.now() - S.t0) / 1000, left = lim - el;
      clock.textContent = fmt(left);
      clock.className = "clock" + (left <= 0 ? " cut" : left <= 10 ? " warn" : "");
      bar.style.width = Math.min(100, 100 * el / lim) + "%";

    }, 200);
  }, function (e) {
    btn.disabled = false;

    m.textContent = e && e.name === "NotAllowedError"
      ? "Le micro est refusé. Autorise-le pour ce site dans les réglages du navigateur, puis réessaie."
      : "Impossible d'ouvrir le micro (" + ((e && (e.name || e.message)) || "erreur") + ").";
    cancelRecording();
  });
}
function finishRec(cut) {
  stopTimer();
  var r = stopRecording(); S.recording = false;
  if (!r) return;
  if (r.stats.speaking < 1) {
    var m = document.getElementById("recmsg"); m.hidden = false; m.className = "notice err";
    m.textContent = "Je n'ai presque rien entendu. Vérifie que le micro n'est pas couvert, puis réessaie.";
    var b = document.getElementById("mic"); b.className = "mic"; b.textContent = "Parler"; return;
  }
  var att = { secs: Math.round(r.secs), stats: r.stats, cut: cut, wav: r.wav };

}
function analyse(att) {
  var kind = S.kind, mine = S;
  if (kind === "relance") att.relanceOf = { transcript: S.v1.transcript, followup: S.v1.followup };
  S.phase = "loading";
  S.loadingMsg = kind === "v1" && S.drill === "partner" ? "Le partner t'écoute et prépare sa relance…" : kind === "v2" ? "Comparaison avec ton premier essai…" : "Écoute et analyse de ta réponse…";
  render();
  blobToB64(att.wav).then(function (b64) {
    var parts;
    if (S.drill === "artic") parts = [{ text: articPrompt(S, kind === "v2") }, audioPart(b64)];
    else if (S.drill === "partner" && kind === "v1") parts = [{ text: relancePrompt(S) }, audioPart(b64)];
    else parts = [{ text: feedbackPrompt(S, att, kind === "v2" ? S.fb1 : null) }, audioPart(b64)];
    return gemini(parts);
  }).then(function (r) {
    if (S !== mine) return;
    att.transcript = String(r.transcript || "");
    delete att.wav;
    if (S.drill === "artic") return articDone(kind, att, r);
    if (S.drill === "partner" && kind === "v1") {
      S.v1 = att; S.v1.followup = String(r.followup || "");
      if (canSpeak) speak(S.v1.followup, S.lang);
      return openRecorder("relance");
    }
    var fb = {
      score: Math.max(0, Math.min(10, Math.round(+r.score || 0))), worked: String(r.worked || ""),
      fix: { title: String((r.fix && r.fix.title) || ""), detail: String((r.fix && r.fix.detail) || "") },
      delivery: String(r.delivery || ""),
      secondsToConclusion: r.secondsToConclusion == null ? null : Math.round(+r.secondsToConclusion),
      numberEarly: !!r.numberEarly, fillers: Math.round(+r.fillers || 0), falseStarts: Math.round(+r.falseStarts || 0),
      heldPushback: r.heldPushback == null ? null : !!r.heldPushback,
      fixApplied: r.fixApplied == null ? null : !!r.fixApplied, verdict: String(r.verdict || ""),
      defects: Array.isArray(r.defects) ? r.defects.slice(0, 3) : []
    };
    if (kind === "v2") { S.v2 = att; S.fb2 = fb; S.phase = "compare"; finishSession(); }
    else { if (kind === "relance") S.v1.relance = att; else S.v1 = att; S.fb1 = fb; S.phase = "feedback"; }
    render();
  }).catch(function (e) {
    if (S !== mine) return;
    S.phase = "error"; S.error = errText(e); S.retry = function () { analyseRetry(att, kind); }; render();
  });
}
function analyseRetry(att, kind) { S.kind = kind; analyse(att); }

function metricsBlock(att, fb) {
  var secs = Math.max(1, att.stats.speaking || att.secs);
  var items = [
    [fb.secondsToConclusion != null ? fb.secondsToConclusion + " s" : "jamais", "avant ta conclusion"],
    [perMin(fb.fillers, secs), "mots parasites / min"],
    [perMin(fb.falseStarts, secs), "faux départs / min"],
    [att.stats.pauses + (att.stats.longest ? " · " + att.stats.longest + " s" : ""), "pauses > 1,5 s · la plus longue"],
    [att.secs + " s", att.cut ? "coupé" : "durée"],
    S.drill === "partner" ? [fb.heldPushback == null ? "–" : fb.heldPushback ? "oui" : "non", "tenu au push-back"] : [fb.numberEarly ? "oui" : "non", "chiffre tôt"]
  ];
  return h("div", { class: "metrics" }, items.map(function (x) { return h("div", { class: "metric" }, h("b", null, String(x[0])), h("span", null, x[1])); }));
}
function viewFeedback() {
  var fb = S.fb1, main = S.v1.relance || S.v1;
  return [
    header(),
    S.cutNote ? h("div", { class: "notice err" }, S.cutNote) : null,
    h("section", { class: "card hero" },
      h("div", { class: "row", style: "justify-content:space-between" }, h("div", { class: "score" }, h("b", null, fb.score), h("span", null, "/10")), S.drill === "partner" ? h("span", { class: "chip lv" }, "Niveau " + S.level) : null),

    h("details", { class: "card" }, h("summary", null, "Ce que tu as dit, mot pour mot"),
      markTranscript(S.v1.transcript),
      S.v1.relance ? [h("div", { class: "speaker" }, "Relance : " + S.v1.followup), markTranscript(S.v1.relance.transcript)] : null),

    metricsBlock(S.v2, b),
    S.levelChange ? h("div", { class: "notice" }, S.levelChange) : null,
    h("details", { class: "card" }, h("summary", null, "Ton deuxième essai, mot pour mot"), markTranscript(S.v2.transcript)),
    h("section", { class: "card", id: "modelcard" },
      h("div", { class: "eyebrow" }, "Version partner senior"),
      S.model ? h("p", { class: "transcript" }, S.model) : h("button", { class: "btn ghost", onclick: loadModel }, "Voir comment un senior le dirait"),
      S.model && canSpeak ? h("button", { class: "link", style: "align-self:flex-start", onclick: function () { speak(S.model.split(/\n\s*Pourquoi\s*:/)[0], S.lang); } }, "L'écouter") : null),
    h("div", { class: "sticky-act" },
      h("button", { class: "btn block", onclick: function () { startDrill(S.drill, { lang: S.lang }); } }, "Drill suivant"),

function loadModel() {

  card.replaceChildren(h("div", { class: "eyebrow" }, "Version partner senior"), h("div", { class: "thinking" }, h("span", { class: "dot" }), "Rédaction…"));

function finishSession() {

      if (DB.profile.streak >= 2 && DB.profile.level < 3) { DB.profile.level++; DB.profile.streak = 0; S.levelChange = "Deux bonnes réponses d'affilée : tu passes au niveau " + DB.profile.level + " (" + LEVELS[DB.profile.level] + ")."; }
    } else DB.profile.streak = 0;

}

/* ---------- articulation ---------- */
function articDone(kind, att, r) {
  var fb = {
    score: Math.max(0, Math.min(10, Math.round(+r.score || 0))),
    issues: Array.isArray(r.issues) ? r.issues.slice(0, 5) : [], rhythm: String(r.rhythm || ""), fix: String(r.fix || ""),
    diff: diffWords(S.caseObj.question, att.transcript)
  };
  if (kind === "v1") { S.v1 = att; S.fb1 = fb; }
  else {
    S.v2 = att; S.fb2 = fb;
    var words = uniq(S.fb1.issues.concat(fb.issues).map(function (x) { return String(x.word || "").toLowerCase(); }).filter(function (w) { return w.length > 2; }));
    addTrapWords(words);
    if (S.fb1.issues.length >= 2) addDefects([{ key: "pronunciation" }]);
    DB.sessions.push({ id: Date.now().toString(36), createdAt: new Date().toISOString(), drill: "artic", lang: S.lang, baselineItem: S.baselineItem,
      question: S.caseObj.question, v1: S.v1.transcript, v2: att.transcript, score1: S.fb1.score, score2: fb.score,
      accuracy1: S.fb1.diff.accuracy, accuracy2: fb.diff.accuracy, trapWords: words, fix: S.fb1.fix });
    save();
  }
  S.phase = "articResult"; render();
}
function viewArticResult() {
  var second = !!S.fb2, fb = second ? S.fb2 : S.fb1, att = second ? S.v2 : S.v1;
  return [
    header(),
    h("section", { class: "card hero" },
      h("div", { class: "eyebrow" }, second ? "De mémoire" : "Lecture"),
      h("div", { class: "row", style: "justify-content:space-between" },
        h("div", { class: "score" }, h("b", null, fb.score), h("span", null, "/10")),
        h("span", { class: "chip" }, fb.diff.accuracy + "% des mots")),
      h("p", { class: "diff" }, fb.diff.raw.map(function (w, i) { return [h("span", { class: fb.diff.hit[i] ? "" : "miss" }, w), " "]; })),

    h("details", { class: "card" }, h("summary", null, "Ce que Gemini a entendu"), markTranscript(att.transcript)),

      h("button", { class: "link", onclick: goHome }, "Accueil"))

/* ---------- baseline, debrief, settings ---------- */
function renderBaseline() {
  goHome(); screen = "baseline";
  var runs = DB.sessions.filter(function (s) { return s.baselineItem; }), done = runs.map(function (s) { return s.baselineItem; });
  $app.replaceChildren(header(),
    h("section", { class: "card" },
      h("h2", null, "Test de référence"),
      h("p", { class: "hint" }, "Les 5 mêmes exercices, en anglais, cette semaine puis dans 6 semaines. Ajoute un transcript de vrai call dans Claude. On fixera les cibles chiffrées après cette baseline."),
      h("ul", { class: "hist" }, BASELINE.map(function (b) {
        var d = done.indexOf(b.id) >= 0;
        return h("li", null, h("div", null, b.label, h("small", null, d ? "Fait au moins une fois" : "À faire")),
          h("button", { class: "btn ghost", onclick: function () { startDrill(b.drill, { lang: "en", baselineItem: b.id, fixedPrompt: b.prompt }); } }, d ? "Refaire" : "Lancer"));
      }))),
    runs.length ? h("section", { class: "card" }, h("div", { class: "eyebrow" }, "Résultats de référence"),
      h("ul", { class: "hist" }, runs.map(function (s) {
        var b = BASELINE.filter(function (x) { return x.id === s.baselineItem; })[0];
        return h("li", null, h("div", null, (b && b.label) || s.baselineItem,
          h("small", null, new Date(s.createdAt).toLocaleDateString("fr-FR") + (s.secondsToConclusion != null ? " · conclusion à " + s.secondsToConclusion + " s" : "") + (s.fillersPerMin != null ? " · " + s.fillersPerMin + " parasites/min" : ""))),
          h("div", { class: "s" }, s.score1 + "/10"));
      }))) : null,

}
function weeklyReport() {
  var since = new Date(Date.now() - 7 * 864e5).toISOString();
  var week = DB.sessions.filter(function (s) { return s.createdAt >= since; });
  return JSON.stringify({ kind: "salle-du-comite/bilan", generatedAt: new Date().toISOString(), profile: DB.profile, sessionsLast7Days: week }, null, 1);
}
function copyText(text, btn) {
  function ok() { btn.textContent = "Copié"; setTimeout(function () { btn.textContent = "Copier le bilan"; }, 2000); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  function fallback() { var ta = document.getElementById("report"); ta.hidden = false; ta.value = text; ta.select(); btn.textContent = "Sélectionné : copie-le"; }
}
function renderDebrief() {
  goHome(); screen = "debrief";

      h("p", { class: "hint" }, "2. Claude te renvoie un bloc JSON (focus, défauts, niveau). Colle-le ici."),
      h("textarea", { id: "upd", placeholder: "{ \"focus\": \"…\", \"defects\": { … } }" }),
      applyBtn, msg),
    h("button", { class: "link", onclick: goHome }, "Retour"));
}
function renderSettings() {
  goHome(); screen = "settings";
  var msg = h("div", { class: "notice", hidden: true });
  var keyIn = h("input", { id: "key", type: "password", autocomplete: "off", value: DB.settings.key, placeholder: "AIza…" });
  var modelIn = h("input", { id: "model", type: "text", autocomplete: "off", value: DB.settings.model });
  var saveBtn = h("button", { class: "btn amber block" }, "Enregistrer et tester");
  saveBtn.onclick = function () {
    DB.settings.key = keyIn.value.trim(); DB.settings.model = modelIn.value.trim() || "gemini-2.5-flash"; save();
    msg.hidden = false; msg.className = "notice"; msg.textContent = "Test en cours…"; saveBtn.disabled = true;
    gemini([{ text: "Reply with only JSON: {\"ok\": true}" }]).then(function () { msg.textContent = "Ça marche. Tu peux lancer un drill."; },
      function (e) { msg.className = "notice err"; msg.textContent = errText(e); }).then(function () { saveBtn.disabled = false; });
  };

    try { var d = JSON.parse(ta.value); if (!d.profile || !Array.isArray(d.sessions)) throw 0;
      var ids = DB.sessions.map(function (s) { return s.id; });
      DB.sessions = DB.sessions.concat(d.sessions.filter(function (s) { return ids.indexOf(s.id) < 0; })).sort(function (a, b) { return a.createdAt.localeCompare(b.createdAt); });
      DB.profile = Object.assign(DB.profile, d.profile); save(); msg.hidden = false; msg.className = "notice"; msg.textContent = "Import fait : " + d.sessions.length + " séances fusionnées.";
    } catch (e) { msg.hidden = false; msg.className = "notice err"; msg.textContent = "Ce texte n'est pas un export valide."; }
  };
  $app.replaceChildren(header(),
    h("section", { class: "card" },
      h("h2", null, "Réglages"),
      h("label", { class: "field" }, h("span", { class: "eyebrow" }, "Clé API Gemini"), keyIn,
        h("span", { class: "hint" }, "Gratuite sur aistudio.google.com → Get API key. Stockée uniquement sur ce téléphone.")),
      h("label", { class: "field" }, h("span", { class: "eyebrow" }, "Modèle"), modelIn,
        h("span", { class: "hint" }, "gemini-2.5-flash par défaut. Change-le si Google en propose un plus récent dans le niveau gratuit.")),
      saveBtn, msg),
    h("section", { class: "card" },
      h("div", { class: "eyebrow" }, "Tes données"),

      h("div", { class: "row" }, exp, imp),
      h("textarea", { id: "dump", hidden: true, "aria-label": "Export ou import" }),
      h("p", { class: "hint" }, "Confidentialité : sur le niveau gratuit, Google peut utiliser ce que tu envoies pour améliorer ses modèles. N'utilise ici que les cas fictifs de l'app.")),
    h("button", { class: "link", onclick: goHome }, "Retour"));
}

/* ================= router ================= */
function render() {
  var v;
  if (!S) { screen = "home"; v = renderHome(); }
  else switch (S.phase) {
    case "loading": v = [header(), h("div", { class: "card" }, h("div", { class: "thinking" }, h("span", { class: "dot" }), S.loadingMsg || "Un instant…"))]; break;
    case "error": v = [header(), h("div", { class: "notice err" }, S.error),
      h("button", { class: "btn", onclick: function () { if (S.retry) { var f = S.retry; S.retry = null; f(); } else startDrill(S.drill, { lang: S.lang }); } }, "Relancer"),
      h("button", { class: "link", onclick: goHome }, "Accueil")]; break;
    case "brief": v = viewBrief(); break;
    case "rec": v = viewRec(); break;
    case "feedback": v = viewFeedback(); break;
    case "compare": v = viewCompare(); break;
    case "articResult": v = viewArticResult(); break;
    default: v = renderHome();
  }
  $app.replaceChildren.apply($app, v.filter(Boolean));
  window.scrollTo(0, 0);
}
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
})();
